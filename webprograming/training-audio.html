<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이 복싱 코치</title>
  <link rel="stylesheet" href="style.css">
   
</head>
<body>
  <header>
    <h1>훈련 드릴</h1>
    <p>아마추어 복싱 루틴 훈련을 시작하세요</p>
  </header>
    <nav>
        <a href="training-audio.html">훈련 드릴</a>
        <a href="not-implemented.html">루틴 생성</a>
        <a href="not-implemented.html">타이머</a>
    </nav>
  <main>
     <div class="section">
      <h2>권장 사항</h2>
      <p>강도 높은 훈련은 100 BPM 이상에서 진행하는 걸 권장합니다</p>
    </div>

    <div class="controls">
      <label for="tempo">템포: <span id="tempo-value">60 BPM</span></label>
      <input type="range" id="tempo" min="30" max="120" value="60">
    </div>

    <div class="controls">
      <button id="start-btn">드릴 시작</button>
      <button id="stop-btn" disabled>드릴 중지</button>
    </div>

    <div id="current-drill">현재 드릴: 없음</div>
    <div id="timer">남은 시간: 2:00</div>

    <audio id="drill-audio" src=""></audio>
  </main>

  <footer>
    <p>© 2025 마이 복싱 코치. All rights reserved.</p>
  </footer>

</body>
 <script src="training-drill.js"></script>
</html>
